alerts:
  - name: High user-visible error rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#alert-1
  - name: Slow response tail latency
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: Low answer quality
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: llm-oncall
    runbook: docs/alerts.md#alert-3
